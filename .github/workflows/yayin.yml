# Anket360 — test, Supabase kurulumu ve GitHub Pages yayını
#
# main dalına her gönderimde:
#   1. test      : tip denetimi, birim/arayüz testleri, RLS testleri (geçici PostgreSQL)
#   2. supabase  : yeni migration'ları uygular, kimlik doğrulama ayarlarını yapar
#                  (Supabase secret'ları tanımlı değilse atlanır)
#   3. yayin     : uygulamayı derleyip GitHub Pages'e yayınlar
#                  (Supabase tanımlı değilse "Demo modu"nda yayınlanır)
#
# Gerekli repository secret'ları (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — proje adresindeki kod: https://<REF>.supabase.co
#   SUPABASE_DB_PASSWORD   — proje oluşturulurken belirlenen veritabanı şifresi
# İsteğe bağlı repository variable: SITE_URL (özel alan adı kullanılırsa)

name: Test ve Yayın

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yayin-${{ github.ref }}
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

jobs:
  test:
    name: Testler
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rls_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tip denetimi
        run: npm run typecheck
      - name: Birim ve arayüz testleri
        run: npm test
      - name: RLS testleri (geçici PostgreSQL)
        run: npm run test:rls
        env:
          RLS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rls_test

  supabase:
    name: Supabase kurulumu
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Secret'ları denetle
        id: ayar
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning title=Supabase atlandı::SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF ve SUPABASE_DB_PASSWORD secret'ları tanımlı değil. Site Demo modunda yayınlanacak."
            echo "hazir=false" >> "$GITHUB_OUTPUT"
          else
            echo "hazir=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.ayar.outputs.hazir == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.ayar.outputs.hazir == 'true'
        with:
          version: 2.20.12

      - name: Secret'ların doğruluğunu denetle
        if: steps.ayar.outputs.hazir == 'true'
        run: |
          if ! [[ "$PROJECT_REF" =~ ^[a-z0-9]{15,30}$ ]]; then
            echo "::error title=SUPABASE_PROJECT_REF hatalı::Yalnızca proje kodu olmalı (ör. abcdefghijklmnopqrst). Adres, boşluk veya büyük harf içermemeli. Uzunluk: ${#PROJECT_REF}"
            exit 1
          fi
          if ! [[ "$SUPABASE_ACCESS_TOKEN" =~ ^sbp_ ]]; then
            echo "::error title=SUPABASE_ACCESS_TOKEN hatalı::Erişim anahtarı sbp_ ile başlamalı (supabase.com/dashboard/account/tokens). Proje anahtarı (anon/service_role) değil."
            exit 1
          fi
          code=$(curl -sS -o /tmp/proje.json -w '%{http_code}' "https://api.supabase.com/v1/projects/$PROJECT_REF" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          case "$code" in
            200) echo "::notice title=Supabase projesi bulundu::$(jq -r '"\(.name) — \(.region) — durum: \(.status)"' /tmp/proje.json)" ;;
            401) echo "::error title=Erişim anahtarı geçersiz::SUPABASE_ACCESS_TOKEN geçersiz veya süresi dolmuş. Yeni anahtar oluşturup secret'ı güncelleyin."; exit 1 ;;
            403|404)
              echo "::error title=Proje bulunamadı::SUPABASE_PROJECT_REF ile eşleşen proje yok veya bu anahtarın sahibine ait değil (HTTP $code). Yanıt: $(head -c 300 /tmp/proje.json | tr '\n' ' ')"
              lc=$(curl -sS -o /tmp/liste.json -w '%{http_code}' "https://api.supabase.com/v1/projects" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
              if [ "$lc" = "200" ]; then
                liste=$(jq -r 'if length == 0 then "hiç proje yok" else map("\(.name) [\(.id[0:4])…, \(.id | length) karakter]") | join(", ") end' /tmp/liste.json)
                echo "::error title=Bu anahtarın gördüğü projeler::$liste — Girilen SUPABASE_PROJECT_REF: ${PROJECT_REF:0:4}…, ${#PROJECT_REF} karakter"
              else
                echo "::error title=Proje listesi alınamadı::HTTP $lc — $(head -c 300 /tmp/liste.json | tr '\n' ' ')"
              fi
              exit 1 ;;
            *) echo "::error title=Supabase API hatası::HTTP $code"; exit 1 ;;
          esac

      - name: Projeye bağlan
        if: steps.ayar.outputs.hazir == 'true'
        run: |
          if ! supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" > /tmp/link.log 2>&1; then
            cat /tmp/link.log
            msg=$(grep -iE "error|failed|password" /tmp/link.log | tail -3 | tr '\n' ' ' | sed "s/$SUPABASE_DB_PASSWORD/***/g")
            echo "::error title=Projeye bağlanılamadı::$msg"
            exit 1
          fi
          cat /tmp/link.log

      - name: Migration'ları uygula
        if: steps.ayar.outputs.hazir == 'true'
        run: |
          if ! (echo y | supabase db push --password "$SUPABASE_DB_PASSWORD") > /tmp/push.log 2>&1; then
            cat /tmp/push.log
            msg=$(grep -iE "error|failed" /tmp/push.log | tail -3 | tr '\n' ' ' | sed "s/$SUPABASE_DB_PASSWORD/***/g")
            echo "::error title=Migration uygulanamadı::$msg"
            exit 1
          fi
          cat /tmp/push.log

      - name: Kimlik doğrulama ayarları (adresler, Türkçe e-postalar)
        if: steps.ayar.outputs.hazir == 'true'
        run: |
          body=$(jq -n --arg site "$SITE_URL" '{
            site_url: $site,
            uri_allow_list: ([$site + "/**", "http://localhost:5173/**"] | join(",")),
            mailer_autoconfirm: false,
            mailer_subjects_confirmation: "Anket360 hesabınızı doğrulayın",
            mailer_templates_confirmation_content: "<h2>Anket360’a hoş geldiniz</h2><p>Hesabınızı etkinleştirmek için aşağıdaki bağlantıya tıklayın:</p><p><a href=\"{{ .ConfirmationURL }}\">E-posta adresimi doğrula</a></p><p>Bu kaydı siz yapmadıysanız bu e-postayı yok sayabilirsiniz.</p>",
            mailer_subjects_recovery: "Anket360 şifre sıfırlama",
            mailer_templates_recovery_content: "<h2>Şifre sıfırlama</h2><p>Yeni şifre belirlemek için aşağıdaki bağlantıya tıklayın:</p><p><a href=\"{{ .ConfirmationURL }}\">Şifremi sıfırla</a></p><p>Bu isteği siz yapmadıysanız bu e-postayı yok sayabilirsiniz.</p>"
          }')
          code=$(curl -sS -o /tmp/yanit.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body")
          if [ "$code" -ge 300 ]; then
            echo "::error::Kimlik doğrulama ayarları yapılamadı (HTTP $code)"; cat /tmp/yanit.json; exit 1
          fi
          echo "Site adresi: $SITE_URL"

  yayin:
    name: GitHub Pages yayını
    needs: [test, supabase]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.supabase.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Supabase bağlantı bilgilerini al
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$PROJECT_REF" ]; then
            anon=$(curl -sSf "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.[] | select(.name == "anon") | .api_key')
            if [ -z "$anon" ] || [ "$anon" = "null" ]; then echo "::error::anon anahtarı alınamadı"; exit 1; fi
            echo "::add-mask::$anon"
            {
              echo "VITE_DATA_BACKEND=supabase"
              echo "VITE_SUPABASE_URL=https://$PROJECT_REF.supabase.co"
              echo "VITE_SUPABASE_ANON_KEY=$anon"
            } >> "$GITHUB_ENV"
            echo "Supabase modunda derlenecek."
          else
            echo "VITE_DATA_BACKEND=local" >> "$GITHUB_ENV"
            echo "Demo modunda derlenecek."
          fi

      - name: Supabase duman testi (şema erişilebilir mi?)
        if: env.VITE_DATA_BACKEND == 'supabase'
        run: |
          for t in profiles organizations memberships invitations surveys responses; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$VITE_SUPABASE_URL/rest/v1/$t?select=*&limit=1" \
              -H "apikey: $VITE_SUPABASE_ANON_KEY" -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY")
            echo "$t → HTTP $code"
            [ "$code" = "200" ] || { echo "::error::$t tablosuna erişilemedi"; exit 1; }
          done

      - name: Derle
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Tek sayfa uygulama yönlendirmesi (404 → index)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Yayınla
        id: deploy
        uses: actions/deploy-pages@v4
